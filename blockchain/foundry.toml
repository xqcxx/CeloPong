[profile.default]
solc = "0.8.20"
auto_detect_solc = false
evm_version = "paris"

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

# RPC endpoints
[rpc_endpoints]
celo_sepolia = "${CELO_SEPOLIA}"
celo_sepolia_alchemy = "https://celo-sepolia.g.alchemy.com/v2/oA3aWf4dW3KozyXiBJ5TiZHnXtykfedo"
celo = "${CELO_MAINNET}"
celo_forno = "https://forno.celo.org"

# Etherscan V2 verification for Celo-compatible explorers.
[etherscan]
celo = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=42220" }
celo_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=11142220" }
